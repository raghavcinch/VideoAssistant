[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videoassistant"
version = "0.1.0"
description = "Local assistant for selecting stable segments from real estate footage and exporting a Resolve handoff."
requires-python = ">=3.10"
dependencies = [
  "imageio-ffmpeg>=0.4.9",
  "numpy>=1.23",
  "opencv-python-headless>=4.8",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
